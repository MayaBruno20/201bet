# Produção / Coolify (Hostinger VPS).
# Postgres e Redis NÃO publicam portas no host — só rede interna Docker.
#
# Entrada pública: serviço `nginx` (porta 80). A Coolify termina SSL e encaminha
# para este serviço nos domínios do site e do admin.
#
# Uso local de teste (sem Coolify):
#   docker compose --env-file .env.production up -d --build

name: bet-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betdb}
      POSTGRES_USER: ${POSTGRES_USER:-betuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-betuser} -d ${POSTGRES_DB:-betdb}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--maxmemory-policy',
        'noeviction',
        '--appendonly',
        'yes',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3502
      DATABASE_URL: postgresql://${POSTGRES_USER:-betuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-betdb}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: 'false'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-noop}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-201Bet}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-200}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      # Upstash opcional — deixe vazio; cache desliga sozinho.
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    volumes:
      - backend_uploads:/app/apps/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3502/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
        NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST:-}
        NEXT_PUBLIC_ADMIN_SITE_HOST: ${NEXT_PUBLIC_ADMIN_SITE_HOST:-}
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - internal

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - '${NGINX_PUBLISH_PORT:-80}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Backup diário do Postgres → volume `backups` (sem bind-mount de ficheiro: Coolify quebra mounts de ficheiro).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-betdb}
      POSTGRES_USER: ${POSTGRES_USER:-betuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        apk add --no-cache tzdata >/dev/null
        cat > /backup-postgres.sh <<'EOS'
        #!/bin/sh
        set -eu
        HOST="${POSTGRES_HOST:-postgres}"
        DB="${POSTGRES_DB:-betdb}"
        USER="${POSTGRES_USER:-betuser}"
        RETENTION_DAYS="${BACKUP_RETENTION_DAYS:-14}"
        STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
        OUT_DIR="/backups"
        OUT_FILE="${OUT_DIR}/${DB}_${STAMP}.dump"
        mkdir -p "${OUT_DIR}"
        echo "[backup] dumping ${DB}@${HOST} → ${OUT_FILE}"
        pg_dump --host="${HOST}" --username="${USER}" --dbname="${DB}" --format=custom --file="${OUT_FILE}"
        echo "[backup] pruning dumps older than ${RETENTION_DAYS} days"
        find "${OUT_DIR}" -type f -name "${DB}_*.dump" -mtime "+${RETENTION_DAYS}" -print -delete || true
        ls -lh "${OUT_DIR}" | tail -n 20
        echo "[backup] done ${STAMP}"
        EOS
        chmod +x /backup-postgres.sh
        echo "0 3 * * * /backup-postgres.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        /backup-postgres.sh
        crond -f -l 8
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    profiles: ['backup']

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backups:

networks:
  internal:
    driver: bridge
