# Deploy Staging → Coolify (Hostinger VPS)

on:
  push:
    branches: [development]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_STAGING }}
      HEALTH_URL: ${{ secrets.BACKEND_STAGING_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Install Root Deps
        run: npm ci

      - name: Install Backend Deps
        run: npm ci --prefix apps/backend

      - name: Install Frontend Deps
        run: npm ci --prefix apps/frontend

      - name: Lint Backend
        run: npm --prefix apps/backend run lint

      - name: Lint Frontend
        run: npm --prefix apps/frontend run lint

      - name: Test Backend
        run: npm --prefix apps/backend run test

      - name: Build Backend
        run: npm --prefix apps/backend run build

      - name: Build Frontend
        run: npm --prefix apps/frontend run build

      # Preferível: Pre-deploy Command na Coolify (backend):
      #   npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Prisma migrate via SSH (opcional)
        if: ${{ env.VPS_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            COMPOSE_DIR="${{ secrets.VPS_COMPOSE_DIR }}"
            if [ -z "$COMPOSE_DIR" ]; then
              echo "Defina o secret VPS_COMPOSE_DIR (pasta do compose na VPS)."
              exit 1
            fi
            cd "$COMPOSE_DIR"
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Deploy Coolify (Staging)
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_STAGING não definido — pulando deploy."
            exit 0
          fi
          curl --fail --retry 3 --retry-delay 5 -X POST "$COOLIFY_WEBHOOK"

      - name: Backend health (opcional)
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "BACKEND_STAGING_HEALTH_URL vazio — skip."
            exit 0
          fi
          sleep 20
          curl --fail --retry 8 --retry-delay 5 "$HEALTH_URL"
